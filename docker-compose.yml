version: "3.8"

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sentinel_scan
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=sentinel_scan
      - SECRET_KEY=super-secret-key-change-in-production
    depends_on:
      - db

  lab:
    build:
      context: .
      dockerfile: Dockerfile
    command: python lab/vulnerable_app.py
    ports:
      - "8000:8000"

volumes:
  db_data:
