<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SentinelScan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="auth-header">
        <h2>SentinelScan</h2>
        <p>Create a new account to get started.</p>
    </div>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div style="margin-bottom: 1.5rem;">
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}" style="border-left: 4px solid {% if category == 'error' %}var(--critical){% else %}var(--low){% endif %}; padding: 0.75rem 1rem;">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div class="auth-input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="auth-input" placeholder="Choose a username" required autofocus>
        </div>
        
        <div class="auth-input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="auth-input" placeholder="Choose a secure password" required>
        </div>
        
        <button type="submit" class="auth-button">Create Account</button>
    </form>
    
    <div class="auth-link">
        Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </div>
</div>

</body>
</html>
